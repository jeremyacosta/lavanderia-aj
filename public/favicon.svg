<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="100%" stop-color="rgba(56,189,248,0.2)"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Full Bleed for Maskable Safe Zone) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Washing Drum Outer Glow Ring -->
  <circle cx="256" cy="246" r="195" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-dasharray="16 10" opacity="0.45"/>
  <circle cx="256" cy="246" r="172" fill="#0369A1" fill-opacity="0.4" stroke="#38BDF8" stroke-width="5" filter="url(#shadow)"/>

  <!-- Water Swirl Curve -->
  <path d="M 120 280 C 160 360, 340 370, 390 280 C 370 320, 290 350, 210 330 C 160 315, 135 295, 120 280 Z" fill="#38BDF8" opacity="0.6"/>
  <path d="M 140 260 C 180 330, 320 340, 370 260 C 340 300, 270 320, 200 305 C 165 295, 148 275, 140 260 Z" fill="#E0F2FE" opacity="0.4"/>

  <!-- Bubbles -->
  <circle cx="150" cy="165" r="16" fill="url(#bubbleGrad)"/>
  <circle cx="145" cy="160" r="4" fill="#FFFFFF"/>

  <circle cx="365" cy="180" r="22" fill="url(#bubbleGrad)"/>
  <circle cx="358" cy="172" r="6" fill="#FFFFFF"/>

  <circle cx="335" cy="130" r="12" fill="url(#bubbleGrad)"/>
  <circle cx="175" cy="340" r="14" fill="url(#bubbleGrad)"/>
  <circle cx="340" cy="330" r="15" fill="url(#bubbleGrad)"/>

  <!-- Clean Sparkle Stars (✨) -->
  <path d="M 370 120 Q 370 135 385 135 Q 370 135 370 150 Q 370 135 355 135 Q 370 135 370 120 Z" fill="#FDE047" filter="url(#glow)"/>
  <path d="M 130 195 Q 130 205 140 205 Q 130 205 130 215 Q 130 205 120 205 Q 130 205 130 195 Z" fill="#38BDF8"/>
  <path d="M 256 80 Q 256 92 268 92 Q 256 92 256 104 Q 256 92 244 92 Q 256 92 256 80 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Center Monogram "AJ" -->
  <g filter="url(#shadow)">
    <text x="256" y="278" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="142" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-4">AJ</text>
  </g>

  <!-- Ribbon Pill "LAVANDERÍA" -->
  <g filter="url(#shadow)">
    <rect x="136" y="318" width="240" height="42" rx="21" fill="#0284C7" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="256" y="345" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">LAVANDERÍA</text>
  </g>
</svg>
